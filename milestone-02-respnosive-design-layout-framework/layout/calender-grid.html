<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .calender{
            display: grid;
            /* grid-gap: 8px; */
            row-gap: 10px;
            column-gap: 2px;
            grid-template-columns: repeat(7,1fr);
            justify-content: center;
            text-align: center;
            width: 70%;
            margin: 0 auto;
            margin-top: 50px;

        }.date{
            box-shadow: 2px 2px 4px black;
            width: 60px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }.date-name{
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: inset;
            border-radius: 5px;
           


        }.date-name:hover{
            background:linear-gradient(to right,orange,yellow);
        }
        .date:hover{
            background: linear-gradient(to right,white,skyblue)
            ;
            font-size: 2em;

        }

    </style>
</head>
<body>
    <div class="calender">
        <div class="date-name">Sat</div>
        <div class="date-name">Sun</div>
        <div class="date-name">Mon</div>
        <div class="date-name">Tues</div>
        <div class="date-name">Wed</div>
        <div class="date-name">Thurs</div>
        <div class="date-name">Fri</div>
        <div class="date">1</div>
        <div class="date">2</div>
        <div class="date">3</div>
        <div class="date">4</div>
        <div class="date">5</div>
        <div class="date">6</div>
        <div class="date">7</div>
        <div class="date">8</div>
        <div class="date">9</div>
        <div class="date">10</div>
        <div class="date">11</div>
        <div class="date">12</div>
        <div class="date">13</div>
        <div class="date">14</div>
        <div class="date">15</div>
        <div class="date">16</div>
        <div class="date">17</div>
        <div class="date">18</div>
        <div class="date">19</div>
        <div class="date">20</div>
        <div class="date">21</div>
        <div class="date">22</div>
        <div class="date">23</div>
        <div class="date">24</div>
        <div class="date">25</div>
        <div class="date">26</div>
        <div class="date">27</div>
        <div class="date">28</div>
        <div class="date">29</div>
        <div class="date">30</div>
    </div>
</body>
</html>

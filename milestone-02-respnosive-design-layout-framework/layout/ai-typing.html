<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Row Master - নাফিজ ভাই</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 700px;
            border: 1px solid #334155;
        }
        #quote-display {
            font-style: italic;
            color: #94a3b8;
            margin-bottom: 20px;
            min-height: 45px;
            font-size: 1rem;
        }
        #display-area {
            font-size: 4.5rem;
            letter-spacing: 15px;
            margin: 20px 0;
            font-weight: 800;
            font-family: 'Monaco', 'Consolas', monospace;
            min-height: 100px;
        }
        .char-default { color: #475569; }
        .char-correct { color: #22c55e; text-shadow: 0 0 15px #22c55e; }
        .char-wrong { color: #ef4444; text-shadow: 0 0 15px #ef4444; display: inline-block; animation: shake 0.2s; }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #hidden-input { position: absolute; opacity: 0; top: -100px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #334155;
        }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 12px; }
        .stat-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body onclick="document.getElementById('hidden-input').focus()">

<div class="container">
    <div id="quote-display">"নাফিজ ভাই, যেকোনো কিছু টাইপ করে শুরু করুন!"</div>
    
    <div id="display-area"></div>
    <input type="text" id="hidden-input" autocomplete="off" autofocus>
    
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Score</div>
            <div id="score" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">KPM</div>
            <div id="kpm" class="stat-value">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Time Left</div>
            <div id="timer" class="stat-value">30</div>
        </div>
    </div>
    <p style="margin-top: 20px; font-size: 0.8rem; color: #475569;">Click anywhere if you lose focus</p>
</div>

<script>
    const displayArea = document.getElementById('display-area');
    const hiddenInput = document.getElementById('hidden-input');
    const scoreDisplay = document.getElementById('score');
    const kpmDisplay = document.getElementById('kpm');
    const timerDisplay = document.getElementById('timer');
    const quoteDisplay = document.getElementById('quote-display');

    const quotes = [
        "নাফিজ ভাই, গতিই শক্তি!",
        "Keep pushing, you're getting faster!",
        "Accuracy is the foundation of speed.",
        "Your fingers are getting smarter!",
        "Consistency is the key to mastery.",
        "Focus on the screen, not the keys!"
    ];

    let score = 0;
    let timeLeft = 30;
    let timerStarted = false;
    let currentNumbers = "";
    let currentIndex = 0;
    let totalCorrectKeys = 0;
    let timerInterval;
    let startTime;

    function generateNumbers() {
        currentNumbers = Math.floor(Math.random() * 900000 + 100000).toString();
        currentIndex = 0;
        renderNumbers();
        hiddenInput.value = "";
    }

    function renderNumbers() {
        displayArea.innerHTML = "";
        currentNumbers.split('').forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            span.className = 'char-default';
            displayArea.appendChild(span);
        });
    }

    function startTimer() {
        if (timerStarted) return;
        timerStarted = true;
        startTime = Date.now();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            
            // Update KPM every second
            const timeElapsedInMinutes = (Date.now() - startTime) / 60000;
            const currentKPM = Math.round(totalCorrectKeys / timeElapsedInMinutes);
            kpmDisplay.innerText = currentKPM || 0;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishGame();
            }
        }, 1000);
    }

    function finishGame() {
        const finalKPM = kpmDisplay.innerText;
        alert(`সময় শেষ নাফিজ ভাই!\nস্কোর: ${score}\nস্পিড: ${finalKPM} KPM`);
        resetGame();
    }

    function resetGame() {
        clearInterval(timerInterval);
        score = 0;
        timeLeft = 30;
        timerStarted = false;
        totalCorrectKeys = 0;
        currentIndex = 0;
        scoreDisplay.innerText = "0";
        kpmDisplay.innerText = "0";
        timerDisplay.innerText = "30";
        quoteDisplay.innerText = quotes[Math.floor(Math.random() * quotes.length)];
        generateNumbers();
    }

    hiddenInput.addEventListener('input', (e) => {
        // Start timer on the very first input
        if (!timerStarted) startTimer();

        const typedValue = hiddenInput.value;
        const lastChar = typedValue[typedValue.length - 1];
        const spans = displayArea.querySelectorAll('span');

        if (lastChar === currentNumbers[currentIndex]) {
            // Correct key
            spans[currentIndex].className = 'char-correct';
            currentIndex++;
            totalCorrectKeys++;
            
            // Generate new set when finished
            if (currentIndex === currentNumbers.length) {
                score++;
                scoreDisplay.innerText = score;
                setTimeout(generateNumbers, 50);
            }
        } else {
            // Wrong key - Red highlight & Shake
            spans[currentIndex].className = 'char-wrong';
            // Briefly show red then revert to default so user can try again
            setTimeout(() => {
                if(spans[currentIndex] && currentIndex < currentNumbers.length) {
                    spans[currentIndex].className = 'char-default';
                }
            }, 250);
            // Clear the wrong character from input
            hiddenInput.value = typedValue.slice(0, -1);
        }
    });

    // Handle backspace to prevent issues
    hiddenInput.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') e.preventDefault();
    });

    // Ensure focus is always on input
    document.addEventListener('keydown', () => hiddenInput.focus());
    
    // Initial Load
    generateNumbers();
</script>

</body>
</html>

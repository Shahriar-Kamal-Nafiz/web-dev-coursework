<html>
    <head>
        <style>
            .container{
                display: grid;
                
                /* grid-template-columns: 200px 100px; */
                /* gap: 50px; */
                /* justify-content: space-around; */
                /* grid-template-columns: 1fr 2fr 3fr; */
                /* grid-template-columns: repeat(2,2fr); */
                /* grid-template-columns: repeat(3,1fr); */
                grid-template-columns: repeat(3,1fr) 4fr;
                grid-gap: 5px;
            }.box-item{
                border: 2px solid navy;
            }
        </style>
    </head>
    <body>
        <h1>grid is a 2d display layout system in css</h1>
        <div class="container">
            <div class="box-item">serial-1</div>
            <div class="box-item">serial-2</div>
            <div class="box-item">serial-3</div>
            <div class="box-item">serial-4</div>
            <div class="box-item">serial-5</div>
            <div class="box-item">serial-6</div>
            <div class="box-item">serial-7</div>
            <div class="box-item">serial-8</div>
        </div>
    </body>
</html>

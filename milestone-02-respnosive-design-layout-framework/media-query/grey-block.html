<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(4,1fr);
            /* grid-template-rows: repeat(5,1fr); */
            grid-template-rows: repeat(3,200px) 50px 50px;
        }.box{
            background-color: gray;
            padding: 10px;
        }.normal-box{
            grid-column: span 1;
            grid-row: span 1;
        }.long-box{
            grid-column: span 1;
            grid-row: span 5;
        }.wide-box{
            grid-column: span 3;
            grid-row: span 1;
        }.red-box{
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box long-box">box 1</div>
        <div class="box normal-box">box 2</div>
        <div class="box normal-box">box 3</div>
        <div class="box normal-box">box 4</div>
        <div class="box normal-box">box 5</div>
        <div class="box normal-box red-box">box 6</div>
        <div class="box normal-box red-box ">box 7</div>
        <div class="box normal-box">box 8</div>
        <div class="box normal-box red-box">box 9</div>
        <div class="box normal-box red-box">box 10</div>
        <div class="box wide-box">box 11</div>
        <div class="box wide-box">box 12</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .field{
            width: 800px;
        }
        .bat img{
            width: 50% ;
            transition: all .3s;
        }
        .field:hover .bat img{
            transform: rotate(-60deg);
            transform-origin: top  right;
        }
        .ball{
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            left: 555px;
            top: 20px;
            transition: transform .7s linear .3s;
            
        }
        .field:hover .ball{
            /* background-color: black; */
            transform: translate(400px ,-300px);
        }
    </style>
</head>
<body>
    <div class="field">
        <div class="bat">
            <img src="bat.png" alt="">
        </div>
        <div class="ball">

        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-img{
            width: 300px;
            height: 200px;
        }
        h6{
            font-size: 1em;
        }

    </style>
</head>
<body>
    <form action="">
        <!-- fieldset is used to grop form elements in a box -->
        <fieldset>
            <label for="search">Search your image here </label>
            <input type="text" required> 
            <button>Search</button>
            <br>
            <img class="product-img" src="keds.jpg" alt="">
            <a href="">For more link click here</a>
            <hr>
            <h6>Feedback Form</h6>
            <label for="name">Name</label><br>
            <input type="text" id="name"><br>
            <label for="date">Date</label><br>
            <input type="date" name="" id="date"><br>
            <label for="comment">Comment</label><br>
            <textarea name="" id="comment" rows="4" cols="40"></textarea><br>
            <button type="submit">Submit</button> 
        </fieldset>
    </form>
</body>
</html>
